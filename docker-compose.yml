services:
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: file:/data/netpulse.db
      HOST: 0.0.0.0
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      NODE_ENV: production
      NETPULSE_ALLOW_LOCAL_TARGETS: "false"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      OUTAGE_FAILURE_THRESHOLD: ${OUTAGE_FAILURE_THRESHOLD:-3}
    volumes:
      - netpulse-data:/data
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NETPULSE_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  netpulse-data:
